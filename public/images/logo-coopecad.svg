<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#011f62"/>
      <stop offset="100%" stop-color="#0a3a8f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a33d"/>
      <stop offset="100%" stop-color="#c97f1e"/>
    </linearGradient>
  </defs>

  <!-- Rond extérieur -->
  <circle cx="100" cy="100" r="96" fill="white" stroke="url(#gold)" stroke-width="4"/>

  <!-- Bouclier bleu -->
  <path d="M 100 18 L 142 40 L 142 100 Q 142 138 100 164 Q 58 138 58 100 L 58 40 Z"
        fill="url(#navy)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>

  <!-- Coins dorés décoratifs du bouclier -->
  <path d="M 58 40 L 70 40 M 142 40 L 130 40" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- "AD" -->
  <text x="100" y="118" font-family="Sora, Arial, sans-serif" font-size="62" font-weight="800"
        text-anchor="middle" fill="#ffffff">AD</text>

  <!-- Bandeau COOPEC -->
  <g transform="translate(100, 26)">
    <rect x="-42" y="-13" width="84" height="26" rx="6" fill="url(#gold)"/>
    <text x="0" y="6" font-family="Sora, Arial, sans-serif" font-size="13" font-weight="800"
          letter-spacing="1" text-anchor="middle" fill="#011f62">COOPEC</text>
  </g>

  <!-- Bandeau Togo -->
  <g transform="translate(100, 178)">
    <rect x="-34" y="-11" width="68" height="22" rx="5" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <text x="0" y="5" font-family="Sora, Arial, sans-serif" font-size="11" font-weight="700"
          letter-spacing="2" text-anchor="middle" fill="#0a3a8f">TOGO</text>
  </g>
</svg>
