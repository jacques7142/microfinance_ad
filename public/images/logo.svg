<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="#011f62" stroke-width="3"/>
  
  <!-- Shield shape -->
  <path d="M 100 20 L 140 40 L 140 100 Q 100 150 100 150 Q 100 150 60 100 L 60 40 Z" 
        fill="none" stroke="#011f62" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- "AD" text -->
  <text x="100" y="120" font-family="Sora, sans-serif" font-size="60" font-weight="700" 
        text-anchor="middle" fill="#011f62">AD</text>
  
  <!-- Badge -->
  <g transform="translate(100, 30)">
    <rect x="-35" y="-12" width="70" height="24" rx="4" fill="#e8a33d"/>
    <text x="0" y="6" font-family="Sora, sans-serif" font-size="12" font-weight="700" 
